name: 每日灵感

on:
  schedule:
    - cron: '30 1 * * *'  # 北京时间 9:30
  workflow_dispatch:

concurrency:
  group: daily-inspiration
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 生成并发送
        run: python generate.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DINGTALK_TOKEN: ${{ secrets.DINGTALK_TOKEN }}
      - name: 提交历史记录
        run: |
          git config user.name "daily-inspiration-bot"
          git config user.email "bot@daily-inspiration"
          git add history.json
          git diff --cached --quiet || git commit -m "每日灵感 $(date +'%Y.%m.%d') 去重历史"
          git pull --rebase
          git push
